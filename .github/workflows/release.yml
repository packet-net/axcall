name: release

# Tag-triggered release. Push a tag like `v0.5.0` to build every supported
# platform and publish them as a GitHub Release. The version stamped into the
# build is the tag minus its leading `v`.
#
# Each artifact is built on a runner of its own platform, so NativeAOT can be
# used without cross-linking anything: that is what takes the binaries from
# ~74 MB to ~4 MB and the .debs to ~1.5 MB. The one exception is linux-arm
# (armhf), which has no runner to build on and so is cross-published from x64
# with trimming and ReadyToRun instead.
#
# Use workflow_dispatch with dry_run to exercise the whole matrix without
# publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.5.0)'
        required: true
      dry_run:
        description: 'Build and check everything, but publish no release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            deb: amd64
            smoke: true
            exercise: true
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            deb: arm64
            smoke: true
            exercise: true
          # No armhf runner exists, so this one is cross-published. It is also
          # the only target that is not NativeAOT, for the same reason.
          - rid: linux-arm
            os: ubuntu-24.04
            deb: armhf
            smoke: false
          # Both macOS slices build on Apple Silicon: Xcode carries the
          # x86_64 SDK, so clang cross-targets it natively. The Intel macos-13
          # image is being retired and queues for 15 minutes or more, which is
          # a poor thing to have a release depend on.
          - rid: osx-x64
            os: macos-14
          - rid: osx-arm64
            os: macos-14
            exercise: true
          - rid: win-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          # How to publish is the csproj's business: NativeAOT everywhere with a
          # native runner, trimmed single-file plus R2R for armhf.
          #
          # Both tools publish into one directory. Each is its own binary, and
          # they share the native library neither can link in, so it is carried
          # once rather than per tool.
          for proj in src/Axcall/Axcall.csproj src/Axsocks/Axsocks.csproj; do
            dotnet publish "$proj" -c Release -r "${{ matrix.rid }}" --self-contained \
              -p:DebugType=none -p:DebugSymbols=false \
              -p:Version="${{ steps.tag.outputs.version }}" \
              -p:InformationalVersion="${{ steps.tag.outputs.version }}" \
              -o "publish/${{ matrix.rid }}"
          done

      - name: Stage the download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ steps.tag.outputs.tag }}"
          RID="${{ matrix.rid }}"
          PUB="publish/$RID"

          # Windows stays a bare .exe. System.IO.Ports calls Win32 directly
          # there, so the executable really is the whole program and there is
          # nothing for an archive to hold that a single file cannot.
          if [ "$RID" = "win-x64" ]; then
            # One archive, because there is more than one tool now, but no
            # companion library: System.IO.Ports calls Win32 directly on
            # Windows.
            dir="axcall-$TAG-$RID"
            rm -rf stage && mkdir -p "stage/$dir"
            cp "$PUB/axcall.exe" "$PUB/axsocks.exe" "stage/$dir/"
            # Compress-Archive rather than 7z: it is part of PowerShell, so it
            # is there whatever the runner image ships.
            powershell -NoProfile -Command "Compress-Archive -Path 'stage/$dir' -DestinationPath 'dist/$dir.zip'"
            ls -l dist
            exit 0
          fi

          # Everywhere else the download is a tarball, because a NativeAOT
          # build is not always one file. System.IO.Ports is out-of-band from
          # the shared framework and ships its native helper only as a shared
          # library, so AOT cannot link it in and the binary dlopens it from
          # its own directory at run time. Publishing the binary by itself is
          # what left every serial port unopenable from v0.5.0 to v0.6.0.
          #
          # armhf has no companion library either, since it is the one target
          # that is not AOT and self-extracts what it needs. It is packaged the
          # same way regardless, so that every Linux and macOS download has one
          # shape and nobody has to wonder why theirs is different.
          dir="axcall-$TAG-$RID"
          rm -rf stage && mkdir -p "stage/$dir"
          for tool in axcall axsocks; do
            cp "$PUB/$tool" "stage/$dir/$tool"
            chmod 0755 "stage/$dir/$tool"
          done

          shopt -s nullglob
          for lib in "$PUB"/*.so "$PUB"/*.dylib; do
            echo "bundling $(basename "$lib")"
            cp "$lib" "stage/$dir/"
            chmod 0644 "stage/$dir/$(basename "$lib")"
          done
          shopt -u nullglob

          {
            printf 'axcall %s (%s)\n\n' "$TAG" "$RID"
            printf 'axcall   dial a station and talk to it\n'
            printf 'axsocks  a SOCKS5 proxy onto the same port, for everything else\n\n'
            printf 'Keep these files together. They load their serial-port support from a\n'
            printf 'library in this directory, and alone they cannot open a serial port.\n\n'
            printf 'Run them from here, or copy the whole directory somewhere permanent and\n'
            printf 'put that directory on your PATH.\n\n'
            printf 'On Debian and Ubuntu, install the .deb instead. It puts axcall on your PATH\n'
            printf 'properly and carries the man page.\n\n'
            printf 'https://github.com/packet-net/axcall\n'
          } > "stage/$dir/README"

          tar -C stage -czf "dist/$dir.tar.gz" "$dir"
          echo "--- tarball contents ---"
          tar -tzf "dist/$dir.tar.gz"
          ls -l dist

      # The bug this packaging exists to prevent is invisible until something
      # actually asks for a serial port: the binary starts, prints its version
      # and passes every other check with its serial support unloadable. So
      # unpack the real download and make it try. Only where the runner can
      # execute what it built, which rules out armhf and the x64 macOS slice
      # that is cross-built on Apple Silicon.
      - name: Check the download can reach a serial port
        if: matrix.exercise
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          dir="axcall-$TAG-${{ matrix.rid }}"
          rm -rf check && mkdir check
          tar -C check -xzf "dist/$dir.tar.gz"

          set +e
          out=$("check/$dir/axcall" --serial /dev/ttyUSB0:9600 -s M0LTE-9 GB7RDG 2>&1)
          set -e
          echo "$out"

          case "$out" in
            *"Unable to load shared library"*)
              echo "::error::the download cannot load its serial support"; exit 1 ;;
          esac
          case "$out" in
            *"/dev/ttyUSB0"*) ;;
            *) echo "::error::expected a complaint about the missing device"; exit 1 ;;
          esac
          echo "serial support loads; it got as far as the device"

      - name: Build the .deb
        if: matrix.deb != ''
        run: scripts/build-deb.sh "${{ matrix.rid }}" "${{ steps.tag.outputs.version }}"

      # Proves the package installs, runs and purges on a pristine Debian and
      # Ubuntu. Only where the runner can execute the binary: armhf has no
      # runner of its own, so its package ships unexercised.
      - name: Smoke-test the .deb
        if: matrix.smoke
        run: scripts/deb-install-smoke.sh artifacts/axcall_*_${{ matrix.deb }}.deb

      - name: Collect the .deb
        if: matrix.deb != ''
        shell: bash
        run: cp artifacts/*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: axcall-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Gather
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          ls -l dist
          # Five tarballs, one Windows .zip and three .debs. Fail loudly
          # rather than publishing a release quietly missing a platform.
          count=$(find dist -type f | wc -l)
          [ "$count" -eq 9 ] || { echo "expected 9 artifacts, got $count"; exit 1; }

      - name: Create release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: axcall ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          # Tags with a prerelease label (e.g. v0.5.0-rc1) are marked
          # pre-release so they don't show as the latest stable build.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: dist/*

      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "### Dry run: nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
