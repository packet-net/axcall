name: deps

# Keeps the tools on the latest packet-net libraries and releases them.
#
# Once a day, and on demand: every Packet.* and M0LTE.* pin in
# Directory.Packages.props is compared against the newest stable version on
# nuget.org. Anything newer is bumped, built and tested exactly as ci.yml does,
# and committed straight to main. Then, if the library pins on main differ from
# those of the latest release, the next minor version is released through
# release.yml, which also publishes to the apt repo.
#
# The commit goes straight to main rather than through a pull request because
# a pull request opened with the workflow's own token does not trigger ci.yml,
# so it would never be tested. The tests run here instead, on the same runner.
#
# When the tests fail nothing is released: the bump is pushed to a
# deps/packet-<version> branch for a person to look at, and an issue says so.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: deps
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: look for newer libraries
    runs-on: ubuntu-24.04
    outputs:
      updates: ${{ steps.find.outputs.updates }}
      summary: ${{ steps.find.outputs.summary }}
    steps:
      - uses: actions/checkout@v6

      - name: Compare pins with nuget.org
        id: find
        shell: bash
        run: |
          set -euo pipefail
          updates=""
          summary=""
          # Each pinned Packet.* or M0LTE.* package, as "id version".
          while read -r id current; do
            lower="$(printf '%s' "$id" | tr '[:upper:]' '[:lower:]')"
            # Stable versions only: a prerelease has a hyphen.
            latest="$(curl -fsSL --retry 3 "https://api.nuget.org/v3-flatcontainer/$lower/index.json" \
              | python3 -c 'import json,sys; print("\n".join(v for v in json.load(sys.stdin)["versions"] if "-" not in v))' \
              | sort -V | tail -1)"
            [ -n "$latest" ] || { echo "::warning::no stable version of $id on nuget.org"; continue; }
            # Only ever move forward.
            if [ "$latest" != "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$latest" ]; then
              echo "$id: $current -> $latest"
              updates="${updates:+$updates }$id=$latest"
              summary="${summary:+$summary, }$id $latest"
            fi
          done < <(sed -nE 's/.*<PackageVersion Include="((Packet|M0LTE)\.[^"]+)" Version="([^"]+)".*/\1 \3/p' Directory.Packages.props)

          [ -n "$updates" ] || echo "every packet-net library is already at its latest version"
          echo "updates=$updates" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  bump:
    name: bump, build and test
    needs: check
    if: needs.check.outputs.updates != ''
    # The same runner as ci.yml, because the integration tests need its Docker.
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply the new versions
        env:
          UPDATES: ${{ needs.check.outputs.updates }}
        run: |
          set -euo pipefail
          for update in $UPDATES; do
            id="${update%%=*}"
            version="${update#*=}"
            sed -i -E "s|(<PackageVersion Include=\"${id//./\\.}\" Version=\")[^\"]+(\")|\1${version}\2|" Directory.Packages.props
          done
          git diff --stat

      - name: Name the branch after the Packet.Core version
        id: branch
        run: |
          core="$(sed -nE 's/.*Include="Packet\.Core" Version="([^"]+)".*/\1/p' Directory.Packages.props)"
          echo "name=deps/packet-${core:-update}" >> "$GITHUB_OUTPUT"
          echo "core=${core}" >> "$GITHUB_OUTPUT"

      - name: build
        run: dotnet build Axcall.slnx --nologo

      - name: test
        run: dotnet test tests/Axcall.Tests/Axcall.Tests.csproj --nologo --no-build --filter "Category!=Peers"

      - name: Commit to main
        env:
          SUMMARY: ${{ needs.check.outputs.summary }}
          CORE: ${{ steps.branch.outputs.core }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): bump Packet.* to ${CORE}" -m "Bumped by the deps workflow: ${SUMMARY}."
          git push origin HEAD:main

      # A failed build or test leaves the bump somewhere a person can pick it
      # up, rather than only in a log.
      - name: Keep the failed bump on a branch
        if: failure()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          CORE: ${{ steps.branch.outputs.core }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "chore(deps): bump Packet.* to ${CORE}" || true
          git push --force origin "$BRANCH"

  report-failure:
    name: open an issue for a failed bump
    needs: [check, bump]
    if: failure() && needs.bump.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          SUMMARY: ${{ needs.check.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Library update failed: ${BRANCH:-deps}"
          body="The deps workflow could not take ${SUMMARY}: the build or tests failed, so nothing was committed to main or released.

          Run: ${RUN_URL}
          The bump is on branch \`${BRANCH}\`."
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  release:
    name: release if the libraries moved
    needs: [check, bump]
    # Runs after a successful bump, and also when there was nothing to bump,
    # so a bump someone merged by hand is released too.
    if: always() && needs.check.result == 'success' && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Compare with the latest release
        id: decide
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          latest="$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -1)"
          [ -n "$latest" ] || { echo "::error::no release tag to compare with"; exit 1; }

          pins() { grep -E 'Include="(Packet|M0LTE)\.' | sed -E 's/^[[:space:]]+//' | sort; }
          if diff <(git show "$latest:Directory.Packages.props" | pins) <(pins < Directory.Packages.props) >/dev/null; then
            echo "the libraries are unchanged since $latest; nothing to release"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The next minor version.
          IFS=. read -r major minor _ <<< "${latest#v}"
          next="v${major}.$((minor + 1)).0"
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists"
            exit 1
          fi
          echo "the libraries changed since $latest; releasing $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      # release.yml's own manual trigger, which a workflow's token is allowed
      # to start. It builds every platform, publishes the release with the tag,
      # and tells the apt repo.
      - name: Start the release
        if: steps.decide.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG" -f dry_run=false
