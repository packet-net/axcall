name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    name: build + test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6

      - name: build
        run: dotnet build tests/Axcall.Tests/Axcall.Tests.csproj --nologo

      # Runs unit + integration tests. The integration tests require Docker
      # (Testcontainers spins up net-sim + LinBPQ); the runner is expected to
      # have it, and the suite fails loudly if it doesn't.
      - name: test
        run: dotnet test tests/Axcall.Tests/Axcall.Tests.csproj --nologo --no-build
