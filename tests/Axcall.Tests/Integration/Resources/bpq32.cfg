SIMPLE=1
NODECALL=PN0TST
NODEALIAS=PNTST
LOCATOR=IO91WL
AGWPORT=8000

# No beacons. Every node on this simulated channel shares one collision
# domain, so LinBPQ's ten-minute ID lands on top of whatever else is on the
# air. That was seen destroying a UA and the I-frame behind it in an unrelated
# axcall-to-axcall test, which then lost its greeting when the SABM retry reset
# the link. The tests are about the exchange under test, not about who else is
# transmitting, so the node stays quiet unless it is answering something.
IDINTERVAL=0
BTINTERVAL=0

CTEXT:
PN0TST axcall interop test node
***

PORT
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 HTTPPORT=8008
 MAXSESSIONS=10
 USER=admin,admin,PN0TST,,SYSOP
ENDPORT

PORT
 ID=netsim
 TYPE=ASYNC
 PROTOCOL=KISS
 IPADDR=netsim
 TCPPORT=8102
 CHANNEL=A
 SPEED=1200
 TXDELAY=100
 FRACK=3000
 RESPTIME=1000
 RETRIES=10
 MAXFRAME=4
 PACLEN=120
 INTERLOCK=0
 MHEARD=Y
ENDPORT

# The IP gateway, for the IP-over-AX.25 tests.
#
# ADAPTER is not optional even though nothing here gates to Ethernet: LinBPQ's
# Init_IP returns early and leaves IP support disabled without it, so the
# container needs NET_RAW for pcap. It then insists on a TAP device, which is
# what carries a packet addressed to the node itself up to the container's own
# kernel, so it needs NET_ADMIN and /dev/net/tun as well.
#
# Leaving the 44/9 route in place (that is, NOT setting NoDefaultRoute) is what
# makes the node answer a ping. Without it the kernel has no route back to the
# radio side, and the reply is never generated.
#
# promiscuous 0 matters. LinBPQ defaults to capturing every packet on the
# adapter, and its poll loop keeps reading pcap until pcap has nothing left. On
# a Docker bridge with other containers on it that is a busy loop competing with
# the AX.25 side, which showed up as unrelated connected-mode tests timing out.
# Nothing here gates IP to Ethernet, so there is nothing to be promiscuous for.
IPGATEWAY
IPAddr 44.131.20.2/24
IPPorts 2
ADAPTER eth0
promiscuous 0
ARP 44.131.20.1 AXTEST 2 D
****
