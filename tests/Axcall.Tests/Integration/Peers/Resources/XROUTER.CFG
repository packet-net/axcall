# XRouter for the peer interop tests.
#
# LOCATOR is mandatory. Without it XRouter prints "ERROR - Missing LOCATOR"
# and exits 255, which through Testcontainers looks like the image being
# broken rather than the config being short of a line.
DNS=8.8.8.8

NODECALL=XR0TST
NODEALIAS=XRTST
LOCATOR=IO91WL
CONSOLECALL=XR0TST
CHATCALL=XR0TST-8
CHATALIAS=XRTCHT

# The address this node answers for over the air.
IPADDRESS=44.131.20.4

# KISS over a pty that socat has bridged to net-sim's KISS TCP port. ASYNC is
# XRouter's only KISS-capable interface type; see IFACES(6).
INTERFACE=1
	TYPE=ASYNC
	COM=/dev/kisspty
	SPEED=9600
	PROTOCOL=KISS
	MTU=256
ENDINTERFACE

PORT=1
	ID="net-sim vhf"
	INTERFACENUM=1
ENDPORT
